<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Serenata Karaoke</title><style>
:root{--bg:#07090e;--panel:#111827;--yellow:#ffd400;--past:#666a73;--future:#f3f4f6;--far:#9ca3af;--sposo:#2563eb;--tutti:#16a34a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}#viewport{height:100dvh;display:flex;align-items:center;justify-content:center;padding:3vh 4vw 17vh}#karaoke{width:min(1100px,95vw)}#songTitle{text-align:center;color:#aeb5c0;font-size:clamp(16px,3.5vw,25px);font-weight:750;margin-bottom:8px}#role{text-align:center;margin-bottom:clamp(12px,2.5vh,28px);min-height:48px}.badge{display:inline-block;padding:.32em .9em;border-radius:999px;font-size:clamp(23px,5vw,48px);font-weight:950;letter-spacing:.06em}.sposo{background:var(--sposo)}.tutti{background:var(--tutti)}#lyrics{display:grid;grid-template-rows:repeat(5,auto);gap:clamp(10px,1.8vh,22px)}.row{text-align:center;line-height:1.18;font-weight:700;text-wrap:balance}.prev{font-size:clamp(18px,3.9vw,35px);color:var(--past);opacity:.7}.current{font-size:clamp(32px,7vw,68px);font-weight:900;min-height:1.25em}.next{font-size:clamp(23px,4.8vw,45px);opacity:.94}.far{font-size:clamp(19px,3.9vw,36px);color:var(--far);opacity:.74}.word{color:var(--future)}.word.done{color:var(--yellow)}.preview-role{display:inline-block;margin-right:.55em;padding:.12em .42em;border-radius:.35em;color:#fff;font-size:.55em;vertical-align:.16em;font-weight:900}#master{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:9px;text-align:center;border-top:1px solid #263043}#masterRow{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap}button,select{border:1px solid #3a4352;border-radius:9px;padding:9px 13px;background:#1a202b;color:#fff;font-size:15px;font-weight:750}#play{background:#22c55e;color:#07140b}#pause{background:#f59e0b;color:#181000}#reset{background:#ef4444}audio{width:min(650px,94vw);height:36px;margin-top:6px}#state{position:fixed;top:8px;left:10px;color:#9ca3af;font-size:12px}#notice{position:fixed;top:8px;right:10px;color:#fbbf24;font-size:12px;text-align:right;max-width:60vw}#error{display:none;position:fixed;inset:20px;z-index:10;padding:18px;border:1px solid #6d3232;border-radius:12px;background:#2b1212;color:#ffdede;white-space:pre-wrap}
</style></head><body><div id="state">Connessione...</div><div id="notice"></div><div id="error"></div><main id="viewport"><div id="karaoke"><div id="songTitle">Serenata</div><div id="role"></div><div id="lyrics"><div class="row prev" id="rPrev"></div><div class="row current" id="rCurrent">Caricamento...</div><div class="row next" id="rNext1"></div><div class="row far" id="rNext2"></div><div class="row far" id="rNext3"></div></div></div></main><section id="master" hidden><div id="masterRow"><select id="songSelect"></select><button id="play">PLAY</button><button id="pause">PAUSA</button><button id="reset">RESET</button><button id="back">-5 s</button><button id="forward">+5 s</button></div><audio id="audio" controls preload="metadata"></audio></section>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getDatabase,ref,set,onValue}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const cfg={apiKey:'AIzaSyCyFu8hXvdaUKpZG-BCDwc8_LbpRhGbMN8',authDomain:'serenata-karaoke-f7acd.firebaseapp.com',databaseURL:'https://serenata-karaoke-f7acd-default-rtdb.europe-west1.firebasedatabase.app',projectId:'serenata-karaoke-f7acd',storageBucket:'serenata-karaoke-f7acd.firebasestorage.app',messagingSenderId:'48285679248',appId:'1:48285679248:web:ab7982a0a9a2e3a3d22215'};
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search),isMaster=q.has('master')||q.get('admin')==='1',audio=$('#audio');let songs=[],song=null,lines=[],lastIdx=null,offset=0,token=0,remote={songId:null,status:'stopped',position:0,startedAt:0};if(isMaster)$('#master').hidden=false;else audio.remove();const db=getDatabase(initializeApp(cfg)),stateRef=ref(db,'karaoke/state');onValue(ref(db,'.info/serverTimeOffset'),s=>offset=s.val()||0);onValue(ref(db,'.info/connected'),s=>$('#state').textContent=s.val()?(isMaster?'MASTER connesso':'VIEWER connesso'):'Disconnesso');
const serverNow=()=>Date.now()+offset;function sec(t){let p=t.split(':');return +p[0]*60+ +p[1]}function dec(s){let x=document.createElement('textarea');x.innerHTML=s;return x.value}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function parse(raw){raw=dec(raw).replace(/<br\s*\/?\s*>/gi,'\n');let out=[],role='';for(let z of raw.split(/\r?\n/)){z=z.trim();let rm=z.match(/^\[(SPOSO|TUTTI)\]$/i);if(rm){role=rm[1].toUpperCase();continue}let m=z.match(/^\[(\d{1,2}:\d{2}(?:\.\d+)?)\]\s*(.*)$/);if(!m)continue;let start=sec(m[1]),words=[],a,re=/<(\d{1,2}:\d{2}(?:\.\d+)?)>\s*([^<]*)/g;while((a=re.exec(m[2]))){let text=a[2].trim();if(text)words.push({time:sec(a[1]),text})}if(!words.length&&m[2].trim())words=[{time:start,text:m[2].trim()}];if(words.length)out.push({start,role,words,text:words.map(w=>w.text).join(' ')})}return out.sort((a,b)=>a.start-b.start)}
async function exists(url){try{return(await fetch(url,{method:'HEAD',cache:'no-store'})).ok}catch{return false}}async function manifest(){let r=await fetch('./songs.json',{cache:'no-store'});if(!r.ok)throw Error('Impossibile caricare songs.json');let d=await r.json();songs=Array.isArray(d)?d:d.songs;if(!Array.isArray(songs)||!songs.length)throw Error('songs.json non contiene canzoni');for(let s of songs)if(!s.id||!s.title||!s.audio||!s.lrc)throw Error('Ogni canzone deve avere id, title, audio e lrc')}
async function selector(){let sel=$('#songSelect');for(let s of songs){s.ok=(await exists(s.audio))&&(await exists(s.lrc));let o=document.createElement('option');o.value=s.id;o.disabled=!s.ok;o.textContent=s.title+(s.ok?'':' (file mancanti)');sel.appendChild(o)}}
async function loadSong(id){let n=++token;song=songs.find(s=>s.id===id)||songs[0];lines=[];lastIdx=null;$('#songTitle').textContent=song.title;$('#rCurrent').textContent='Caricamento...';for(let x of ['#rPrev','#rNext1','#rNext2','#rNext3','#role'])$(x).innerHTML='';try{let r=await fetch(song.lrc,{cache:'no-store'});if(!r.ok)throw Error('LRC mancante: '+song.lrc);let p=parse(await r.text());if(!p.length)throw Error('LRC non riconosciuto');if(n!==token)return;lines=p;$('#notice').textContent='';if(isMaster){audio.src=song.audio;audio.load()}}catch(e){$('#rCurrent').textContent='Canzone non disponibile';$('#notice').textContent=e.message}}
function time(){if(isMaster)return Number.isFinite(audio.currentTime)?audio.currentTime:0;if(remote.status==='playing')return Math.max(0,remote.position+(serverNow()-remote.startedAt)/1000);return Math.max(0,remote.position||0)}function ix(t){let i=-1;for(let n=0;n<lines.length;n++){if(lines[n].start<=t)i=n;else break}return i}function at(i){return i>=0&&i<lines.length?lines[i]:null}function preview(i){let x=at(i);if(!x)return'';return(x.role?`<span class="preview-role ${x.role.toLowerCase()}">${x.role}</span>`:'')+esc(x.text)}function setRole(r){$('#role').innerHTML=r?`<span class="badge ${r.toLowerCase()}">${r==='SPOSO'?'CANTA LO SPOSO':'TUTTI'}</span>`:''}
function render(){let t=time(),i=ix(t);if(lines.length){if(i!==lastIdx){$('#rPrev').innerHTML=preview(i-1);$('#rNext1').innerHTML=preview(i+1);$('#rNext2').innerHTML=preview(i+2);$('#rNext3').innerHTML=preview(i+3);setRole(i>=0?lines[i].role:lines[0].role);lastIdx=i}$('#rCurrent').innerHTML=i<0?'La canzone sta per iniziare':lines[i].words.map(w=>`<span class="word ${t>=w.time?'done':''}">${esc(w.text)}</span>`).join(' ')}requestAnimationFrame(render)}
async function publish(status,position,songId=song?.id){await set(stateRef,{songId,status,position,startedAt:status==='playing'?serverNow():0,updatedAt:serverNow()})}
onValue(stateRef,async s=>{let v=s.val();if(!v||isMaster)return;let changed=!song||song.id!==v.songId;remote={...remote,...v};if(changed)await loadSong(v.songId)});
$('#songSelect').onchange=async e=>{audio.pause();await loadSong(e.target.value);audio.currentTime=0;await publish('stopped',0,e.target.value)};$('#play').onclick=async()=>{if(!lines.length)return;try{await audio.play();await publish('playing',audio.currentTime)}catch{$('#notice').textContent='Audio non disponibile o bloccato'}};$('#pause').onclick=async()=>{audio.pause();await publish('paused',audio.currentTime)};$('#reset').onclick=async()=>{audio.pause();audio.currentTime=0;lastIdx=null;await publish('stopped',0)};$('#back').onclick=async()=>{audio.currentTime=Math.max(0,audio.currentTime-5);lastIdx=null;await publish(audio.paused?'paused':'playing',audio.currentTime)};$('#forward').onclick=async()=>{audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+5);lastIdx=null;await publish(audio.paused?'paused':'playing',audio.currentTime)};audio.addEventListener('ended',()=>publish('stopped',0));
/* Ogni 2 secondi il MASTER invia ai VIEWER la posizione reale del player. */
if(isMaster)setInterval(async()=>{if(!audio.paused&&!audio.ended&&song&&lines.length){try{await publish('playing',audio.currentTime,song.id)}catch{$('#notice').textContent='Sincronizzazione periodica non riuscita'}}},2000);
(async()=>{try{await manifest();if(isMaster)await selector();let first=songs.find(s=>s.ok)||songs[0];await loadSong(first.id);if(isMaster){$('#songSelect').value=first.id;await publish('stopped',0,first.id)}}catch(e){$('#error').style.display='block';$('#error').textContent=e.message}render()})();
</script></body></html>
