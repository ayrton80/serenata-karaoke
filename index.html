<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Serenata Karaoke</title>
<style>
:root{--bg:#07090e;--yellow:#ffd400;--past:#666a73;--future:#f3f4f6;--far:#9ca3af;--sposo:#2563eb;--tutti:#16a34a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}#viewport{height:100dvh;display:flex;align-items:center;justify-content:center;padding:3vh 4vw 15vh}#karaoke{width:min(1100px,95vw)}#role{text-align:center;margin-bottom:clamp(12px,2.5vh,28px);min-height:48px}.badge{display:inline-block;padding:.32em .9em;border-radius:999px;font-size:clamp(23px,5vw,48px);font-weight:950;letter-spacing:.06em}.badge.sposo{background:var(--sposo)}.badge.tutti{background:var(--tutti)}#lyrics{display:grid;grid-template-rows:repeat(5,auto);gap:clamp(10px,1.8vh,22px)}.row{text-align:center;line-height:1.18;font-weight:700;text-wrap:balance}.prev{font-size:clamp(18px,3.9vw,35px);color:var(--past);opacity:.7}.current{font-size:clamp(32px,7vw,68px);font-weight:900;min-height:1.25em}.next{font-size:clamp(23px,4.8vw,45px);opacity:.94}.far{font-size:clamp(19px,3.9vw,36px);color:var(--far);opacity:.74}.word{color:var(--future)}.word.done{color:var(--yellow)}.preview-role{display:inline-block;margin-right:.55em;padding:.12em .42em;border-radius:.35em;color:#fff;font-size:.55em;vertical-align:.16em;font-weight:900}.preview-role.sposo{background:var(--sposo)}.preview-role.tutti{background:var(--tutti)}#master{position:fixed;left:0;right:0;bottom:0;background:#111827;padding:10px;text-align:center;z-index:4}button{border:0;border-radius:9px;padding:10px 16px;margin:3px;font-weight:800;cursor:pointer}#play{background:#22c55e}#pause{background:#f59e0b}#reset{background:#ef4444;color:#fff}audio{width:min(620px,92vw);vertical-align:middle}#state{position:fixed;top:8px;left:10px;color:#9ca3af;font-size:12px}#error{position:fixed;inset:0;background:#111827;padding:30px;color:#ff9b9b;display:none;z-index:9;white-space:pre-wrap}
</style></head><body>
<div id="state">Connessione...</div><div id="error"></div><main id="viewport"><div id="karaoke"><div id="role"></div><div id="lyrics"><div class="row prev" id="rPrev"></div><div class="row current" id="rCurrent">In attesa del regista...</div><div class="row next" id="rNext1"></div><div class="row far" id="rNext2"></div><div class="row far" id="rNext3"></div></div></div></main>
<section id="master" hidden><audio id="audio" controls preload="auto" src="audio/vieni-da-me.mp3"></audio><br><button id="play">PLAY</button><button id="pause">PAUSA</button><button id="reset">RESET</button></section>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getDatabase,ref,set,onValue,onDisconnect}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const cfg={apiKey:'AIzaSyCyFu8hXvdaUKpZG-BCDwc8_LbpRhGbMN8',authDomain:'serenata-karaoke-f7acd.firebaseapp.com',databaseURL:'https://serenata-karaoke-f7acd-default-rtdb.europe-west1.firebasedatabase.app',projectId:'serenata-karaoke-f7acd',storageBucket:'serenata-karaoke-f7acd.firebasestorage.app',messagingSenderId:'48285679248',appId:'1:48285679248:web:ab7982a0a9a2e3a3d22215'};
const $=s=>document.querySelector(s),isMaster=new URLSearchParams(location.search).has('master'),audio=$('#audio');let lines=[],remote={status:'stopped',position:0,startedAt:0},offset=0,lastIdx=null;
if(isMaster)$('#master').hidden=false;else audio.remove();
const app=initializeApp(cfg),db=getDatabase(app),stateRef=ref(db,'karaoke/state');onValue(ref(db,'.info/serverTimeOffset'),s=>offset=s.val()||0);onValue(ref(db,'.info/connected'),s=>$('#state').textContent=s.val()?(isMaster?'MASTER connesso':'VIEWER connesso'):'Disconnesso');onValue(stateRef,s=>{remote=s.val()||remote;if(isMaster)syncMasterToRemote()});
function serverNow(){return Date.now()+offset}function sec(t){let p=t.split(':');return +p[0]*60+ +p[1]}function dec(s){let x=document.createElement('textarea');x.innerHTML=s;return x.value}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function parse(raw){raw=dec(raw).replace(/<br\s*\/?\s*>/gi,'\n');let out=[],role='';for(let z of raw.split(/\r?\n/)){z=z.trim();let rm=z.match(/^\[(SPOSO|TUTTI)\]$/i);if(rm){role=rm[1].toUpperCase();continue}let m=z.match(/^\[(\d{1,2}:\d{2}(?:\.\d+)?)\]\s*(.*)$/);if(!m)continue;let start=sec(m[1]),words=[],a,re=/<(\d{1,2}:\d{2}(?:\.\d+)?)>\s*([^<]*)/g;while((a=re.exec(m[2]))){let text=a[2].trim();if(text)words.push({time:sec(a[1]),text})}if(words.length)out.push({start,role,words,text:words.map(w=>w.text).join(' ')})}return out.sort((a,b)=>a.start-b.start)}
async function load(){try{let r=await fetch('songs/vieni-da-me.lrc',{cache:'no-store'});if(!r.ok)throw Error('File songs/vieni-da-me.lrc non trovato');lines=parse(await r.text());if(!lines.length)throw Error('LRC non riconosciuto')}catch(e){$('#error').style.display='block';$('#error').textContent=e.message+'\n\nControlla che nel repository esista songs/vieni-da-me.lrc.'}}load();
function now(){if(remote.status==='playing')return remote.position+(serverNow()-remote.startedAt)/1000;return remote.position||0}function ix(t){let i=-1;for(let n=0;n<lines.length;n++){if(lines[n].start<=t)i=n;else break}return i}function inf(i){return i>=0&&i<lines.length?lines[i]:null}function preview(i){let x=inf(i);if(!x)return'';let b=x.role?`<span class="preview-role ${x.role.toLowerCase()}">${x.role}</span>`:'';return b+esc(x.text)}function role(r){$('#role').innerHTML=r?`<span class="badge ${r.toLowerCase()}">${r==='SPOSO'?'CANTA LO SPOSO':'TUTTI'}</span>`:''}
function draw(){let t=now(),i=ix(t);if(lines.length){if(i!==lastIdx){$('#rPrev').innerHTML=preview(i-1);$('#rNext1').innerHTML=preview(i+1);$('#rNext2').innerHTML=preview(i+2);$('#rNext3').innerHTML=preview(i+3);role(i>=0?lines[i].role:lines[0].role);lastIdx=i}if(i<0)$('#rCurrent').textContent='La canzone sta per iniziare';else $('#rCurrent').innerHTML=lines[i].words.map(w=>`<span class="word ${t>=w.time?'done':''}">${esc(w.text)}</span>`).join(' ')}requestAnimationFrame(draw)}draw();
async function write(status,position){await set(stateRef,{status,position,startedAt:status==='playing'?serverNow():0,updatedAt:serverNow()})}
$('#play')?.addEventListener('click',async()=>{await audio.play();await write('playing',audio.currentTime)});$('#pause')?.addEventListener('click',async()=>{audio.pause();await write('paused',audio.currentTime)});$('#reset')?.addEventListener('click',async()=>{audio.pause();audio.currentTime=0;await write('stopped',0)});audio?.addEventListener('ended',()=>write('stopped',0));
function syncMasterToRemote(){if(!isMaster)return;let t=now();if(Math.abs(audio.currentTime-t)>.5)audio.currentTime=Math.max(0,t);if(remote.status==='playing'&&audio.paused)audio.play().catch(()=>{});if(remote.status!=='playing'&&!audio.paused)audio.pause()}
</script></body></html>
