<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090e">
<title>Serenata Karaoke</title>
<style>
:root{--bg:#07090e;--panel:#111827;--yellow:#ffd400;--past:#666a73;--future:#f3f4f6;--far:#9ca3af;--sposo:#2563eb;--tutti:#16a34a;--danger:#ef4444}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}#viewport{height:100dvh;display:flex;align-items:center;justify-content:center;padding:3vh 4vw 17vh}#karaoke{width:min(1100px,95vw)}#songTitle{text-align:center;color:#aeb5c0;font-size:clamp(16px,3.5vw,25px);font-weight:750;margin-bottom:8px}#role{text-align:center;margin-bottom:clamp(12px,2.5vh,28px);min-height:48px}.badge{display:inline-block;padding:.32em .9em;border-radius:999px;font-size:clamp(23px,5vw,48px);font-weight:950;letter-spacing:.06em}.badge.sposo{background:var(--sposo)}.badge.tutti{background:var(--tutti)}#lyrics{display:grid;grid-template-rows:repeat(5,auto);gap:clamp(10px,1.8vh,22px)}.row{text-align:center;line-height:1.18;font-weight:700;text-wrap:balance}.prev{font-size:clamp(18px,3.9vw,35px);color:var(--past);opacity:.7}.current{font-size:clamp(32px,7vw,68px);font-weight:900;min-height:1.25em}.next{font-size:clamp(23px,4.8vw,45px);opacity:.94}.far{font-size:clamp(19px,3.9vw,36px);color:var(--far);opacity:.74}.word{color:var(--future)}.word.done{color:var(--yellow)}.preview-role{display:inline-block;margin-right:.55em;padding:.12em .42em;border-radius:.35em;color:#fff;font-size:.55em;vertical-align:.16em;font-weight:900}.preview-role.sposo{background:var(--sposo)}.preview-role.tutti{background:var(--tutti)}#master{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:9px;text-align:center;z-index:4;border-top:1px solid #263043}#masterRow{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap}button,select{border:1px solid #3a4352;border-radius:9px;padding:9px 13px;background:#1a202b;color:#fff;font-size:15px;font-weight:750}button{cursor:pointer}button:disabled,select:disabled{opacity:.45;cursor:not-allowed}#play{background:#22c55e;color:#07140b}#pause{background:#f59e0b;color:#181000}#reset{background:var(--danger)}audio{width:min(650px,94vw);height:36px;margin-top:6px}#state{position:fixed;top:8px;left:10px;color:#9ca3af;font-size:12px}#notice{position:fixed;top:8px;right:10px;color:#fbbf24;font-size:12px;text-align:right;max-width:60vw}#error{display:none;position:fixed;inset:20px;z-index:10;padding:18px;border:1px solid #6d3232;border-radius:12px;background:#2b1212;color:#ffdede;overflow:auto;white-space:pre-wrap}
</style></head>
<body>
<div id="state">Connessione...</div><div id="notice"></div><div id="error"></div>
<main id="viewport"><div id="karaoke"><div id="songTitle">Serenata</div><div id="role"></div><div id="lyrics"><div class="row prev" id="rPrev"></div><div class="row current" id="rCurrent">Caricamento...</div><div class="row next" id="rNext1"></div><div class="row far" id="rNext2"></div><div class="row far" id="rNext3"></div></div></div></main>
<section id="master" hidden><div id="masterRow"><select id="songSelect" aria-label="Canzone"></select><button id="play">PLAY</button><button id="pause">PAUSA</button><button id="reset">RESET</button><button id="back">-5 s</button><button id="forward">+5 s</button></div><audio id="audio" controls preload="metadata"></audio></section>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import{getDatabase,ref,set,onValue}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyCyFu8hXvdaUKpZG-BCDwc8_LbpRhGbMN8',authDomain:'serenata-karaoke-f7acd.firebaseapp.com',databaseURL:'https://serenata-karaoke-f7acd-default-rtdb.europe-west1.firebasedatabase.app',projectId:'serenata-karaoke-f7acd',storageBucket:'serenata-karaoke-f7acd.firebasestorage.app',messagingSenderId:'48285679248',appId:'1:48285679248:web:ab7982a0a9a2e3a3d22215'};
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search),isMaster=q.has('master')||q.get('admin')==='1',audio=$('#audio');
let songs=[],song=null,lines=[],lastIdx=null,offset=0,loadingToken=0,remote={songId:null,status:'stopped',position:0,startedAt:0};
if(isMaster)$('#master').hidden=false;else audio.remove();
const db=getDatabase(initializeApp(firebaseConfig)),stateRef=ref(db,'karaoke/state');
onValue(ref(db,'.info/serverTimeOffset'),s=>offset=s.val()||0);
onValue(ref(db,'.info/connected'),s=>$('#state').textContent=s.val()?(isMaster?'MASTER connesso':'VIEWER connesso'):'Disconnesso');
function serverNow(){return Date.now()+offset}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function sec(t){const p=t.split(':');return Number(p[0])*60+Number(p[1])}function decode(s){const x=document.createElement('textarea');x.innerHTML=s;return x.value}
function parseLRC(raw){raw=decode(raw).replace(/<br\s*\/?\s*>/gi,'\n');const out=[];let role='';for(const source0 of raw.split(/\r?\n/)){const source=source0.trim(),rm=source.match(/^\[(SPOSO|TUTTI)\]$/i);if(rm){role=rm[1].toUpperCase();continue}const m=source.match(/^\[(\d{1,2}:\d{2}(?:\.\d+)?)\]\s*(.*)$/);if(!m)continue;const start=sec(m[1]),body=m[2];let words=[],a,re=/<(\d{1,2}:\d{2}(?:\.\d+)?)>\s*([^<]*)/g;while((a=re.exec(body))!==null){const text=a[2].trim();if(text)words.push({time:sec(a[1]),text})}if(!words.length&&body.trim())words=[{time:start,text:body.trim()}];if(words.length)out.push({start,role,words,text:words.map(w=>w.text).join(' ')})}return out.sort((a,b)=>a.start-b.start)}
async function exists(url){try{const r=await fetch(url,{method:'HEAD',cache:'no-store'});return r.ok}catch{return false}}
async function loadManifest(){const r=await fetch('./songs.json',{cache:'no-store'});if(!r.ok)throw Error(`Impossibile caricare songs.json (${r.status}).`);const data=await r.json();songs=Array.isArray(data)?data:data.songs;if(!Array.isArray(songs)||!songs.length)throw Error('songs.json non contiene canzoni.');for(const s of songs){if(!s.id||!s.title||!s.audio||!s.lrc)throw Error('Ogni canzone deve avere id, title, audio e lrc.')}}
async function buildSelector(){const sel=$('#songSelect');sel.innerHTML='';for(const s of songs){const lrcOK=await exists(s.lrc),audioOK=await exists(s.audio);s.lrcOK=lrcOK;s.audioOK=audioOK;const o=document.createElement('option');o.value=s.id;o.disabled=!(lrcOK&&audioOK);o.textContent=s.title+(lrcOK&&audioOK?'':' (file mancanti)');sel.appendChild(o)}}
async function loadSong(id){const token=++loadingToken,next=songs.find(s=>s.id===id);song=next||songs[0];if(!song)return;lastIdx=null;lines=[];$('#songTitle').textContent=song.title;$('#role').innerHTML='';$('#rPrev').textContent='';$('#rCurrent').textContent='Caricamento...';$('#rNext1').textContent='';$('#rNext2').textContent='';$('#rNext3').textContent='';try{const r=await fetch(song.lrc,{cache:'no-store'});if(!r.ok)throw Error(`LRC mancante: ${song.lrc}`);const parsed=parseLRC(await r.text());if(!parsed.length)throw Error(`LRC non riconosciuto: ${song.lrc}`);if(token!==loadingToken)return;lines=parsed;$('#notice').textContent='';if(isMaster){audio.src=song.audio;audio.load()}}catch(e){if(token!==loadingToken)return;$('#rCurrent').textContent='Canzone non ancora disponibile';$('#notice').textContent=e.message;if(isMaster){audio.removeAttribute('src');audio.load()}}}
function karaokeTime(){if(remote.status==='playing')return Math.max(0,remote.position+(serverNow()-remote.startedAt)/1000);return Math.max(0,remote.position||0)}function indexAt(t){let i=-1;for(let n=0;n<lines.length;n++){if(lines[n].start<=t)i=n;else break}return i}function info(i){return i>=0&&i<lines.length?lines[i]:null}function preview(i){const x=info(i);if(!x)return'';const b=x.role?`<span class="preview-role ${x.role.toLowerCase()}">${x.role}</span>`:'';return b+esc(x.text)}function setRole(r){$('#role').innerHTML=r?`<span class="badge ${r.toLowerCase()}">${r==='SPOSO'?'CANTA LO SPOSO':'TUTTI'}</span>`:''}
function render(){const t=karaokeTime(),i=indexAt(t);if(lines.length){if(i!==lastIdx){$('#rPrev').innerHTML=preview(i-1);$('#rNext1').innerHTML=preview(i+1);$('#rNext2').innerHTML=preview(i+2);$('#rNext3').innerHTML=preview(i+3);setRole(i>=0?lines[i].role:lines[0].role);lastIdx=i}if(i<0)$('#rCurrent').textContent='La canzone sta per iniziare';else $('#rCurrent').innerHTML=lines[i].words.map(w=>`<span class="word ${t>=w.time?'done':''}">${esc(w.text)}</span>`).join(' ')}requestAnimationFrame(render)}
async function publish(status,position,songId=song?.id){await set(stateRef,{songId,status,position,startedAt:status==='playing'?serverNow():0,updatedAt:serverNow()})}
onValue(stateRef,async snap=>{const v=snap.val();if(!v)return;const changed=!song||song.id!==v.songId;remote={...remote,...v};if(changed)await loadSong(v.songId);if(isMaster){$('#songSelect').value=remote.songId||'';syncMaster()}});
function syncMaster(){if(!isMaster||!song)return;const t=karaokeTime();if(Number.isFinite(audio.duration)&&Math.abs(audio.currentTime-t)>.65)audio.currentTime=Math.min(t,audio.duration||t);if(remote.status==='playing'&&audio.paused)audio.play().catch(()=>{});if(remote.status!=='playing'&&!audio.paused)audio.pause()}
$('#songSelect').addEventListener('change',async e=>{audio.pause();await loadSong(e.target.value);await publish('stopped',0,e.target.value)});
$('#play').addEventListener('click',async()=>{if(!song||!lines.length)return;try{await audio.play();await publish('playing',audio.currentTime)}catch(e){$('#notice').textContent='Audio non disponibile o bloccato dal browser.'}});
$('#pause').addEventListener('click',async()=>{audio.pause();await publish('paused',audio.currentTime)});
$('#reset').addEventListener('click',async()=>{audio.pause();audio.currentTime=0;await publish('stopped',0)});
$('#back').addEventListener('click',async()=>{audio.currentTime=Math.max(0,audio.currentTime-5);await publish(audio.paused?'paused':'playing',audio.currentTime)});
$('#forward').addEventListener('click',async()=>{audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+5);await publish(audio.paused?'paused':'playing',audio.currentTime)});
audio.addEventListener('ended',()=>publish('stopped',0));
(async()=>{try{await loadManifest();if(isMaster)await buildSelector();const first=songs.find(s=>s.lrcOK&&s.audioOK)||songs[0];await loadSong(first.id);if(isMaster){$('#songSelect').value=first.id;const snapRemote=remote.songId;if(!snapRemote)await publish('stopped',0,first.id)}}catch(e){$('#error').style.display='block';$('#error').textContent=e.message+'\n\nVerifica songs.json nella stessa cartella di index.html.'}render()})();
</script></body></html>
