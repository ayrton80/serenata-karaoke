<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>Serenata Karaoke</title>
  <style>
    :root { --bg:#090b10; --card:#151922; --text:#f4f6f8; --muted:#737b89; --next:#d6dae0; --active:#ffd400; --accent:#64b5f6; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
    body { overflow:hidden; }
    #app { height:100dvh; display:grid; grid-template-rows:auto 1fr auto; }
    header { padding:14px 18px 10px; background:linear-gradient(180deg,#111722 0%,rgba(9,11,16,.92) 100%); border-bottom:1px solid #242b38; }
    #title { margin:0; font-size:clamp(20px,5vw,32px); text-align:center; }
    #status { margin-top:5px; text-align:center; color:#9ca5b3; font-size:13px; }
    #role { min-height:31px; margin:12px auto 0; width:max-content; max-width:100%; padding:5px 13px; border-radius:999px; color:#07111a; background:var(--accent); font-weight:900; letter-spacing:.08em; visibility:hidden; }
    #lyricsViewport { position:relative; overflow:hidden; padding:12vh 18px 18vh; }
    #lyrics { transition:transform .35s ease; will-change:transform; }
    .line { max-width:900px; margin:0 auto; padding:12px 4px; text-align:center; font-size:clamp(25px,7vw,48px); line-height:1.16; font-weight:800; color:var(--muted); opacity:.42; transition:color .25s,opacity .25s,transform .25s; }
    .line.past { color:#606775; opacity:.32; }
    .line.active { color:var(--active); opacity:1; transform:scale(1.025); text-shadow:0 0 18px rgba(255,212,0,.18); }
    .line.next { color:var(--next); opacity:.94; }
    .line.after { color:#aeb5c0; opacity:.68; }
    footer { padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:#0d1118; border-top:1px solid #242b38; }
    #progress { height:5px; background:#292f3a; border-radius:4px; overflow:hidden; }
    #bar { width:0; height:100%; background:var(--active); transition:width .12s linear; }
    #admin { display:none; gap:8px; justify-content:center; align-items:center; margin-top:10px; flex-wrap:wrap; }
    #admin.visible { display:flex; }
    button,select { border:1px solid #3a4352; border-radius:9px; padding:9px 13px; background:#1a202b; color:white; font-size:15px; }
    button.primary { background:#ffd400; border-color:#ffd400; color:#151515; font-weight:900; }
    #clock { min-width:92px; text-align:center; font-variant-numeric:tabular-nums; }
    #error { display:none; position:fixed; inset:20px; z-index:10; padding:18px; border:1px solid #6d3232; border-radius:12px; background:#2b1212; color:#ffdede; overflow:auto; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Serenata</h1>
    <div id="status">Caricamento…</div>
    <div id="role"></div>
  </header>
  <main id="lyricsViewport"><div id="lyrics"></div></main>
  <footer>
    <div id="progress"><div id="bar"></div></div>
    <div id="admin">
      <select id="songSelect" aria-label="Canzone"></select>
      <button id="back">−5 s</button>
      <button id="play" class="primary">Avvia</button>
      <button id="forward">+5 s</button>
      <span id="clock">00:00</span>
    </div>
  </footer>
</div>
<div id="error"></div>

<script type="module">
/*
  FILE ATTESO: songs.json, nella stessa cartella di index.html

  Formato accettato:
  {
    "songs": [{
      "id": "vieni-da-me",
      "title": "Vieni da me",
      "duration": 240,
      "lines": [
        {"time": 0.0, "role": "SPOSO", "text": "Prima riga"},
        {"time": 4.5, "role": "SPOSO", "text": "Seconda riga"},
        {"time": 9.2, "role": "TUTTI", "text": "Riga del coro"}
      ]
    }]
  }

  MODALITA REGISTA: aggiungere ?admin=1 all'indirizzo.
  Questa versione di prova sincronizza automaticamente le schede aperte sullo
  stesso dispositivo. Per sincronizzare telefoni diversi occorre compilare la
  configurazione Firebase qui sotto.
*/

const firebaseConfig = {
  // apiKey: "",
  // authDomain: "",
  // databaseURL: "",
  // projectId: "",
  // appId: ""
};

const $ = id => document.getElementById(id);
const isAdmin = new URLSearchParams(location.search).get('admin') === '1';
const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('serenata-karaoke') : null;
let songs=[], song=null, state={songId:null, playing:false, startedAt:0, pausedAt:0}, db=null;

function showError(msg){ $('error').style.display='block'; $('error').textContent=msg; }
function now(){ return Date.now()/1000; }
function currentTime(){ return state.playing ? Math.max(0, now()-state.startedAt) : (state.pausedAt||0); }
function fmt(s){ s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

async function loadSongs(){
  const r=await fetch('./songs.json',{cache:'no-store'});
  if(!r.ok) throw new Error('Impossibile caricare songs.json ('+r.status+').');
  const data=await r.json(); songs=Array.isArray(data)?data:data.songs;
  if(!Array.isArray(songs)||!songs.length) throw new Error('songs.json non contiene alcuna canzone.');
  for(const s of songs){ if(!s.id||!s.title||!Array.isArray(s.lines)) throw new Error('Formato songs.json non valido.'); }
}

function setSong(id){
  song=songs.find(s=>s.id===id)||songs[0]; state.songId=song.id;
  $('title').textContent=song.title; $('lyrics').innerHTML='';
  song.lines.forEach((x,i)=>{ const d=document.createElement('div'); d.className='line'; d.dataset.i=i; d.textContent=x.text; $('lyrics').appendChild(d); });
}

function activeIndex(t){
  let i=-1; for(let n=0;n<song.lines.length;n++){ if(song.lines[n].time<=t) i=n; else break; } return i;
}

function render(){
  if(!song) return;
  const t=currentTime(), idx=activeIndex(t), nodes=[...document.querySelectorAll('.line')];
  nodes.forEach((n,i)=>{ n.className='line '+(i<idx?'past':i===idx?'active':i===idx+1?'next':i===idx+2?'after':''); });
  const role=idx>=0?song.lines[idx].role:''; $('role').textContent=role||''; $('role').style.visibility=role?'visible':'hidden';
  if(idx>=0&&nodes[idx]){
    const viewport=$('lyricsViewport'), y=nodes[idx].offsetTop-viewport.clientHeight*.35;
    $('lyrics').style.transform=`translateY(${-Math.max(0,y)}px)`;
  }
  const duration=song.duration || (song.lines.at(-1)?.time+8) || 1;
  $('bar').style.width=Math.min(100,t/duration*100)+'%'; $('clock').textContent=fmt(t);
  $('status').textContent=state.playing?'In corso':'In attesa'; $('play').textContent=state.playing?'Pausa':'Avvia';
  requestAnimationFrame(render);
}

function normalizeState(v){
  if(!v) return; state={...state,...v};
  if(!song||song.id!==state.songId) setSong(state.songId);
}

async function publish(){
  channel?.postMessage(state); localStorage.setItem('serenata-state',JSON.stringify(state));
  if(db) await db.set(state);
}

async function setupRealtime(){
  const configured=Boolean(firebaseConfig.apiKey&&firebaseConfig.databaseURL&&firebaseConfig.projectId);
  if(!configured){
    $('status').textContent='Prova locale';
    channel?.addEventListener('message',e=>normalizeState(e.data));
    addEventListener('storage',e=>{ if(e.key==='serenata-state'&&e.newValue) normalizeState(JSON.parse(e.newValue)); });
    const saved=localStorage.getItem('serenata-state'); if(saved) normalizeState(JSON.parse(saved));
    return;
  }
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js');
  const {getDatabase,ref,set,onValue}=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js');
  const app=initializeApp(firebaseConfig), database=getDatabase(app), refState=ref(database,'serenata/live');
  db={set:v=>set(refState,v)}; onValue(refState,s=>{ if(s.exists()) normalizeState(s.val()); });
}

function setupAdmin(){
  if(!isAdmin) return; $('admin').classList.add('visible');
  songs.forEach(s=>{ const o=document.createElement('option'); o.value=s.id;o.textContent=s.title;$('songSelect').appendChild(o); });
  $('songSelect').value=state.songId;
  $('songSelect').onchange=async e=>{ state={songId:e.target.value,playing:false,startedAt:0,pausedAt:0};setSong(state.songId);await publish(); };
  $('play').onclick=async()=>{ const t=currentTime(); if(state.playing){state.playing=false;state.pausedAt=t;}else{state.playing=true;state.startedAt=now()-t;}await publish(); };
  $('back').onclick=async()=>{ const t=Math.max(0,currentTime()-5);state.pausedAt=t;if(state.playing)state.startedAt=now()-t;await publish(); };
  $('forward').onclick=async()=>{ const t=currentTime()+5;state.pausedAt=t;if(state.playing)state.startedAt=now()-t;await publish(); };
}

(async()=>{
  try{
    await loadSongs(); state.songId=songs[0].id; setSong(state.songId);
    await setupRealtime(); setupAdmin(); render();
  }catch(e){ showError(e.message+' Controlla che index.html e songs.json siano nella stessa cartella e che GitHub Pages sia pubblicato.'); }
})();
</script>
</body>
</html>
